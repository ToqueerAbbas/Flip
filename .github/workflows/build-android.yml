name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Set launch background color
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/values
          cat > $RES/values/flip_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="flip_launch_bg">#ffd9a0</color></resources>
          EOF
          if [ -f $RES/values/styles.xml ]; then sed -i 's#@drawable/splash#@color/flip_launch_bg#g' $RES/values/styles.xml; fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
